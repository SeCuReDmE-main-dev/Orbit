<title id="orbit-title">Orbit: the person chooses, an assistant proposes, a human reviews</title>
<desc id="orbit-description">A top-to-bottom diagram starts with the person choosing an activity, selected work and permissions. Their personal assistant calls pedagogical WebMCP tools, which check consent and revision. The tools read public research or course Context and receive entries with provenance. A separate branch presents selected work in a versioned dossier for human review by a teacher or author. This diagram represents the reading and proposal path; publication uses a separate acceptance step.</desc>
